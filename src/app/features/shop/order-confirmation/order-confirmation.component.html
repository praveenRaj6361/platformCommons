<div class="confirm-page">
  <div class="confirm-card">
    <div class="success-icon" aria-hidden="true">✅</div>
    <h1>Order Placed!</h1>
    <p class="order-id">Order ID: <strong>{{ orderId() }}</strong></p>
    <p class="message">
      Thank you for shopping with us. A confirmation will be sent to your email.
    </p>
    <div class="actions">
      <a routerLink="/shop/order-history" class="btn-secondary">View Orders</a>
      <a routerLink="/shop" class="btn-primary">Continue Shopping</a>
    </div>
  </div>
</div>
