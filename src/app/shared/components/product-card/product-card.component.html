<div class="card">
  <a [routerLink]="['/shop/products', product.id]" class="card-link">

    <div class="card-img-wrap">
      <img [src]="product.thumbnail" [alt]="product.title" loading="lazy" class="card-img" />
      <span
        class="stock-badge"
        [class.low]="product.stock > 0 && product.stock <= 5"
        [class.out]="product.stock === 0"
      >
        {{ product.stock === 0
            ? 'Out of stock'
            : product.stock <= 5
              ? 'Low: ' + product.stock
              : 'In stock: ' + product.stock
        }}
      </span>
    </div>

    <div class="card-body">
      <p class="category">{{ product.category }}</p>
      <h3 class="title">{{ product.title }}</h3>
      <p class="price">₹{{ product.price | number:'1.0-0' }}</p>
      <span class="rating">★ {{ product.rating | number:'1.1-1' }}</span>
    </div>
  </a>

  <div class="card-footer">
    <button
      class="btn-add"
      [disabled]="product.stock === 0"
      (click)="addToCart()"
    >
      {{ product.stock === 0 ? 'Out of Stock' : 'Add to Cart' }}
    </button>
  </div>
</div>
